plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.ailenezareti.monitor'
    compileSdk 34

    defaultConfig {
        applicationId "com.ailenezareti.monitor"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"

        // ============================================================
        // BU İKİ SƏTRİ HƏR UŞAQ ÜÇÜN DƏYİŞİN, SONRA BUILD EDİN:
        // Dashboard-da "+ Uşaq əlavə et" edəndə aldığınız kodu SERVER_DEVICE_TOKEN-ə yazın.
        // Beləliklə APK quraşdırılanda kod soruşulmur, avtomatik bağlıdır.
        // ============================================================
        buildConfigField "String", "SERVER_BASE_URL", "\"https://hesabat.site/usaq\""
        buildConfigField "String", "SERVER_DEVICE_TOKEN", "\"fb2a9eb300840e62f0f869aab39677c33c9d8148274725490c24b34361b0bbf5\""
    }

    buildFeatures {
        buildConfig true
        viewBinding true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // Konum servisi
    implementation 'com.google.android.gms:play-services-location:21.3.0'

    // Arxa fon işləri (istifadə statistikası, zəng qeydi sinxronizasiyası)
    implementation 'androidx.work:work-runtime-ktx:2.9.1'

    // Şəbəkə
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // Koroutinlər
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
}
